server:
  port: ${PORT:8080}

spring:
  application:
    name: trazza-webservice
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trazza_database?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

trazza:
  token:
    secret: ${TOKEN_SECRET:}
    issuer: trazza-platform
    access-token-minutes: 60
    refresh-token-days: 14
  personal-data:
    encryption-key: ${PERSONAL_DATA_ENCRYPTION_KEY:}
    hash-key: ${PERSONAL_DATA_HASH_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
